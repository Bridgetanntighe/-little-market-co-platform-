[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Pretty URLs for primary pages (directory index.html files from build).
# SPA fallback last — existing static files take precedence on Netlify.

[[redirects]]
  from = "/wedding-flower-bar-hire-london"
  to = "/wedding-flower-bar-hire-london/index.html"
  status = 200

[[redirects]]
  from = "/celebrations"
  to = "/celebrations/index.html"
  status = 200

[[redirects]]
  from = "/packages"
  to = "/packages/index.html"
  status = 200

[[redirects]]
  from = "/enquire"
  to = "/enquire/index.html"
  status = 200

[[redirects]]
  from = "/corporate-flower-bar-london"
  to = "/corporate-flower-bar-london/index.html"
  status = 200

[[redirects]]
  from = "/partner-with-us"
  to = "/partner-with-us/index.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy/index.html"
  status = 200

# Retired SEO landers
[[redirects]]
  from = "/flower-bar-hire-london"
  to = "/"
  status = 301

[[redirects]]
  from = "/flower-bar-hire-london/"
  to = "/"
  status = 301

[[redirects]]
  from = "/brand-activation-flower-bar"
  to = "/corporate-flower-bar-london/"
  status = 301

[[redirects]]
  from = "/brand-activation-flower-bar/"
  to = "/corporate-flower-bar-london/"
  status = 301

[[redirects]]
  from = "/christmas-flower-bar-london"
  to = "/celebrations/"
  status = 301

[[redirects]]
  from = "/christmas-flower-bar-london/"
  to = "/celebrations/"
  status = 301

[[redirects]]
  from = "/flower-workshop-london"
  to = "/packages/"
  status = 301

[[redirects]]
  from = "/flower-workshop-london/"
  to = "/packages/"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
