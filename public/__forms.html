<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Form definitions</title>
  </head>
  <body>
    <form
      name="enquiry"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify-honeypot="bot-field"
      hidden
      aria-hidden="true"
    >
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="eventType" />
      <input name="venue" />
      <input name="bouquets" />
      <input name="eventDate" type="date" />
      <input name="dateUndecided" />
      <input name="guests" />
      <input name="packageChoice" />
      <input name="colourIdeas" />
      <textarea name="additional"></textarea>
    </form>
    <form
      name="work-with-us"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify-honeypot="bot-field"
      hidden
      aria-hidden="true"
    >
      <input type="hidden" name="form-name" value="work-with-us" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="travelAreas" />
      <input name="interest" />
      <textarea name="experience"></textarea>
      <input name="portfolio" />
      <input name="availability" />
    </form>
    <form
      name="partner-with-us"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify-honeypot="bot-field"
      hidden
      aria-hidden="true"
    >
      <input type="hidden" name="form-name" value="partner-with-us" />
      <input name="bot-field" />
      <input name="name" />
      <input name="businessName" />
      <input name="email" type="email" />
      <input name="website" />
      <input name="businessType" />
      <textarea name="partnershipIdea"></textarea>
    </form>
  </body>
</html>
