<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <title>Form definitions</title>
  </head>
  <body>
    <!-- Static Netlify Forms skeleton for SPA detection. Field names must match React. -->
    <form
      name="enquiry"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify-honeypot="bot-field"
      hidden
      aria-hidden="true"
    >
      <input type="hidden" name="form-name" value="enquiry" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" type="email" />
      <input name="phone" />
      <input name="company" />
      <input name="eventType" />
      <input name="packageChoice" />
      <input name="eventDate" type="date" />
      <input name="venue" />
      <input name="guests" />
      <input name="christmasBooking" />
      <input name="brandPersonalisation" />
      <input name="flowerPalette" />
      <textarea name="additional"></textarea>
    </form>
  </body>
</html>
